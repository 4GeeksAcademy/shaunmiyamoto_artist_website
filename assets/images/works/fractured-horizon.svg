      <stop offset="0%" stop-color="#c8d5d6"/>
      <stop offset="100%" stop-color="#efe1cb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17324c"/>
      <stop offset="100%" stop-color="#3d6a8a"/>
